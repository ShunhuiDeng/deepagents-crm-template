name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint Python
        run: uv run ruff check app tests scripts
      - name: Test Python
        run: uv run pytest -q
      - name: Check browser JavaScript
        run: node --check app/static/app.js
      - name: Check startup script
        run: bash -n scripts/start-local.sh
