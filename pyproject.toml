[project]
name = "deepagents-crm-template"
version = "1.0.0"
description = "Intelligent CRM with role-scoped AI workflows and PostgreSQL"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "argon2-cffi>=25.1,<26",
  "deepagents==0.7.5",
  "email-validator>=2.2,<3",
  "fastapi>=0.116,<1",
  "httpx[socks]>=0.28,<1",
  "langchain-openai>=1.0,<2",
  "langgraph-checkpoint-postgres==3.1.2",
  "pycryptodome>=3.23,<4",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
